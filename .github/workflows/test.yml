name: Test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check for UI changes
        id: ui-changes
        run: |
          if git diff --name-only origin/main...HEAD | grep -q '^ui/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.ui-changes.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        if: steps.ui-changes.outputs.changed == 'true'
        run: cd ui && npm ci && npm run build
      - name: Lint UI
        if: steps.ui-changes.outputs.changed == 'true'
        run: cd ui && npm run lint
      - run: go build ./...
      - run: go test ./...
      - run: go vet ./examples/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: ASCII punctuation check (Go sources)
        run: |
          if grep -rnP "[\xE2\x80\x93\xE2\x80\x94\xE2\x80\xA6\xE2\x86\x90\xE2\x86\x91\xE2\x86\x92\xE2\x86\x93]" --include="*.go" .; then
            echo "::error::Found unicode dash, arrow, or ellipsis in .go files. Use plain ASCII (comma, colon, ->, ..., etc.)."
            exit 1
          fi
      - uses: golangci/golangci-lint-action@v7
